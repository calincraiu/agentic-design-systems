[project]
name = "agentic-design-systems"
version = "0.2.0"
description = "Course kit: agentic workflows for computational design with Claude Code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
