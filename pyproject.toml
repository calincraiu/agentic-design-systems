[project]
name = "agentic-design-systems"
version = "0.1.0"
description = "Course kit: agentic workflows for computational design with Claude Code, Rhino and Grasshopper."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "jsonschema>=4.20",
]

[project.scripts]
kit = "kit.cli:main"
tower = "examples.tower.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
