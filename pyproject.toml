[project]
name = "agentic-design-systems"
version = "0.3.0"
description = "Course app: agentic workflows for computational design with Claude Code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "markdown>=3.5",
    "matplotlib>=3.8",
]

[project.scripts]
course = "app.main:run"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["kits/tower/tools/tower", "."]
