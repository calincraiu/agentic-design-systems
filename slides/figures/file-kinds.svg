<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="A file's name has two parts: the name, then the extension after the dot, which says what kind of file it is. A PDF and a Rhino file opened in Notepad show unreadable codes. CLAUDE.md, a text file, shows plain words">
  <!-- 1 · a file name, taken apart -->
  <g data-step="1">
    <text x="420" y="70" style="font-size:40px">tower-plan</text>
    <text class="accent-text" x="660" y="70" style="font-size:40px">.dwg</text>
    <path class="ink" d="M420 90 V104 H652 V90"/>
    <text class="label" x="420" y="132">the name</text>
    <path class="accent" d="M662 90 V104 H756 V90"/>
    <text class="label accent-text" x="662" y="132">the extension</text>
    <text class="small" x="662" y="156">what kind of file it is</text>
  </g>

