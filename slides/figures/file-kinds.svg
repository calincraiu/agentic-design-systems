    <text class="muted-text" x="70" y="314">4 0 obj /Filter</text>
    <text class="muted-text" x="70" y="344">xœ•Y]o·}÷¯ð¼ÿ</text>
    <text class="muted-text" x="70" y="374">ÂÖ±Ð¿ ¤ž†Ë€</text>

    <rect class="hair" x="430" y="200" width="340" height="200"/>
    <rect class="ink-fill" x="430" y="200" width="340" height="44"/>
    <text class="paper-text" x="450" y="229">tower.3dm in Notepad</text>
    <text class="muted-text" x="450" y="284">3D Geometry File</text>
    <text class="muted-text" x="450" y="314">Format ÿÿ ¤ Ð</text>
    <text class="muted-text" x="450" y="344">€¿ÂÖ±ž†Ë ÿØ</text>
    <text class="muted-text" x="450" y="374">¼ÿÐ¤ €Âž ±</text>

    <text class="small" x="50" y="440">Codes that only their own program can read.</text>
  </g>

  <!-- 3 · a text file: only words -->
  <g data-step="3">
    <rect class="box-accent" x="810" y="200" width="340" height="200"/>
    <rect class="accent-fill" x="810" y="200" width="340" height="44"/>
    <text class="on-accent" x="830" y="229">CLAUDE.md in Notepad</text>
    <text x="830" y="284"># Project notes</text>
    <text x="830" y="314">Keep answers short.</text>
    <text x="830" y="344">- Never make up a</text>
    <text x="830" y="374">  number: use tools.</text>
    <text class="small accent-text" x="810" y="440">A text file: only words.</text>
  </g>
</svg>
