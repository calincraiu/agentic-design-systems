<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="The Claude desktop app is one program on your computer. At the top of its window are two tabs, Chat and Code. The Chat tab is a conversation: you talk a design through. The Code tab works in a folder on your computer, with files in it. Both tabs reach the same model, far away, drawn as a cloud">

  <!-- 1 · one window, two tabs -->
  <g data-step="1">
    <rect class="paper" x="60" y="120" width="1080" height="340" rx="14"/>
    <circle cx="84" cy="138" r="4" class="ink-fill"/><circle cx="98" cy="138" r="4" class="ink-fill"/><circle cx="112" cy="138" r="4" class="ink-fill"/>
    <text class="small" x="1116" y="144" text-anchor="end">the Claude desktop app</text>
    <line class="thin" x1="60" y1="156" x2="1140" y2="156"/>
    <!-- the two tabs, centred -->
    <rect class="paper" x="470" y="164" width="130" height="36" rx="8"/>
    <rect class="paper" x="610" y="164" width="130" height="36" rx="8"/>
    <text x="535" y="189" text-anchor="middle">Chat</text>
    <text x="675" y="189" text-anchor="middle">Code</text>
    <line class="thin" x1="60" y1="200" x2="1140" y2="200"/>
  </g>

  <!-- 2 · the Chat tab: a conversation -->
  <g data-step="2">
    <rect class="box-accent" x="470" y="164" width="130" height="36" rx="8"/>
    <text class="accent-text" x="535" y="189" text-anchor="middle">Chat</text>
    <text class="body" x="96" y="246">The Chat tab</text>
    <text class="small" x="96" y="272">a conversation: talk a design through</text>
    <rect class="soft" x="96" y="292" width="250" height="24" rx="12"/>
    <rect class="ink-fill" x="330" y="326" width="220" height="24" rx="12"/>
    <rect class="soft" x="96" y="360" width="190" height="24" rx="12"/>
    <rect class="hair" x="96" y="408" width="454" height="30" rx="15"/>
  </g>

  <!-- 3 · the Code tab: work in a folder -->
  <g data-step="3">
    <rect class="box-blue" x="610" y="164" width="130" height="36" rx="8"/>
    <text x="675" y="189" text-anchor="middle" style="fill:var(--blue)">Code</text>
    <text class="body" x="650" y="246">The Code tab</text>
    <text class="small" x="650" y="272">work in a folder on your computer</text>
    <path class="paper" d="M650 292 H700 L716 308 H1000 V388 H650 Z"/>
    <g class="paper-text">
      <path class="paper" d="M672 322 H700 L710 332 V372 H672 Z"/>
      <path class="paper" d="M732 322 H760 L770 332 V372 H732 Z"/>
      <path class="paper" d="M792 322 H820 L830 332 V372 H792 Z"/>
    </g>
    <text class="small" x="850" y="352">your files</text>
    <rect class="hair" x="650" y="408" width="454" height="30" rx="15"/>
  </g>

  <!-- 4 · the same model behind both -->
  <g data-step="4">
    <g transform="translate(239,-10) scale(0.6)">
      <path class="box-accent" d="M470 135 A35 35 0 0 1 480 68 A55 55 0 0 1 585 40 A60 60 0 0 1 700 62 A38 38 0 0 1 735 135 Z" style="stroke-width:4"/>
    </g>
    <text class="label accent-text" x="600" y="54" text-anchor="middle" style="font-size:13px">MODEL</text>
    <text class="small" x="700" y="40">the same model, far away,</text>
    <text class="small" x="700" y="62">behind both tabs</text>
    <line class="ink dash" x1="560" y1="68" x2="535" y2="164"/>
    <line class="ink dash" x1="640" y1="68" x2="675" y2="164"/>
  </g>
</svg>
