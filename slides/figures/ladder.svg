<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="The ladder of authorship as a staircase of six steps: Prompt, Context, Skill, Tool, Measure, Workflow. In Session 1 you climbed from prompting to writing the context, a skill and a first tool contract. Session 2 takes the tool further and adds measures, and Sessions 3 and 4 connect it all into a workflow">
  <rect class="paper" x="60" y="345" width="185" height="55"/>
    <rect class="paper" x="245" y="290" width="185" height="110"/>
    <rect class="paper" x="430" y="235" width="185" height="165"/>
    <rect class="paper" x="615" y="180" width="185" height="220"/>
    <rect class="paper" x="800" y="125" width="185" height="275"/>
    <rect class="paper" x="985" y="70" width="185" height="330"/>
  <line class="thin" x1="40" y1="400" x2="1180" y2="400"/>
  <text class="label" x="60" y="335">you started here</text>
  <g data-step="1">
    <rect class="soft" x="245" y="290" width="185" height="110"/>
    <rect class="soft" x="430" y="235" width="185" height="165"/>
    <rect class="soft" x="615" y="180" width="185" height="220"/>
  </g>
  <g data-step="2">
    <rect class="box-blue dash" x="622" y="187" width="171" height="206"/>
    <rect class="box-blue dash" x="807" y="132" width="171" height="261"/>
  </g>
  <g data-step="3">
    <rect class="hair dash" x="992" y="77" width="171" height="316"/>
  </g>
  <text x="74" y="379" style="font-size:21px">1 · Prompt</text>
    <text x="259" y="324" style="font-size:21px">2 · Context</text>
    <text x="444" y="269" style="font-size:21px">3 · Skill</text>
    <text x="629" y="214" style="font-size:21px">4 · Tool</text>
    <text x="814" y="159" style="font-size:21px">5 · Measure</text>
    <text x="999" y="104" style="font-size:21px">6 · Workflow</text>
  <g data-step="1">
    <text class="small accent-text" x="259" y="352">Session 1</text>
    <text class="small accent-text" x="444" y="297">Session 1</text>
    <text class="small accent-text" x="629" y="242">Session 1</text>
  </g>
  <g data-step="2">
    <text class="small" x="629" y="264" style="fill:var(--blue)">Session 2</text>
    <text class="small" x="814" y="187" style="fill:var(--blue)">Session 2</text>
  </g>
  <g data-step="3">
    <text class="small" x="999" y="132">Sessions 3–4</text>
  </g>
</svg>
