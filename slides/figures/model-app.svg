<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="One model, many apps. The model is far away, on the company's servers, drawn as a cloud. Three different apps on your side all reach out to the same model over the internet: the web app in a browser, the desktop app on your computer, and an add-in, a panel inside another program such as a design app. Each app has its own instructions and tools, but the model is the same">

  <!-- 1 · the model, far away -->
  <g data-step="1">
    <path class="box-accent" d="M470 135 A35 35 0 0 1 480 68 A55 55 0 0 1 585 40 A60 60 0 0 1 700 62 A38 38 0 0 1 735 135 Z"/>
    <!-- a tiny network inside the cloud -->
    <g class="thin">
      <line x1="560" y1="70" x2="600" y2="62"/><line x1="560" y1="70" x2="600" y2="84"/>
      <line x1="640" y1="70" x2="600" y2="62"/><line x1="640" y1="70" x2="600" y2="84"/>
    </g>
    <g class="accent-fill"><circle cx="560" cy="70" r="5"/><circle cx="600" cy="62" r="5"/><circle cx="600" cy="84" r="5"/><circle cx="640" cy="70" r="5"/></g>
    <text class="label accent-text" x="600" y="116" text-anchor="middle" style="font-size:15px">THE MODEL</text>
    <text class="small" x="760" y="92">far away, on the company's servers</text>
    <text class="small" x="760" y="114">it reads text and writes text</text>
  </g>

  <!-- 2 · the web app -->
  <g data-step="2">
    <line class="ink dash" x1="560" y1="135" x2="220" y2="250"/>
    <rect class="paper" x="50" y="250" width="300" height="212" rx="14"/>
    <!-- a browser window -->
    <rect class="paper" x="110" y="270" width="180" height="104" rx="6"/>
    <line class="thin" x1="110" y1="292" x2="290" y2="292"/>
    <circle cx="121" cy="281" r="3" class="ink-fill"/><circle cx="132" cy="281" r="3" class="ink-fill"/><circle cx="143" cy="281" r="3" class="ink-fill"/>
    <rect class="hair" x="156" y="275" width="124" height="12" rx="6"/>
    <rect class="ink-fill" x="200" y="302" width="76" height="14" rx="7"/>
    <rect class="soft" x="124" y="324" width="100" height="14" rx="7"/>
    <rect class="hair" x="124" y="348" width="152" height="16" rx="8"/>
    <text class="label" x="200" y="398" text-anchor="middle">The web app</text>
    <text class="body" x="200" y="424" text-anchor="middle">a page in your browser</text>
  </g>

  <!-- 3 · the desktop app -->
  <g data-step="3">
    <line class="ink dash accent" x1="600" y1="135" x2="600" y2="250" style="stroke-width:2"/>
    <rect class="paper" x="450" y="250" width="300" height="212" rx="14" style="stroke:var(--accent);stroke-width:3"/>
    <!-- a monitor with a window: sidebar and chat -->
    <rect class="paper" x="510" y="270" width="180" height="88" rx="6"/>
    <rect class="soft" x="510" y="270" width="44" height="88" rx="6"/>
    <line class="thin" x1="554" y1="270" x2="554" y2="358"/>
    <rect class="ink-fill" x="610" y="284" width="68" height="14" rx="7"/>
    <rect class="soft" x="566" y="306" width="90" height="14" rx="7"/>
    <rect class="hair" x="566" y="332" width="112" height="16" rx="8"/>
    <line class="ink" x1="600" y1="358" x2="600" y2="372"/><line class="ink" x1="574" y1="372" x2="626" y2="372"/>
    <text class="label accent-text" x="600" y="398" text-anchor="middle">The desktop app</text>
    <text class="body" x="600" y="424" text-anchor="middle">a program on your computer</text>
  </g>

  <!-- 4 · an add-in -->
  <g data-step="4">
    <line class="ink dash" x1="640" y1="135" x2="980" y2="250"/>
    <rect class="paper" x="850" y="250" width="300" height="212" rx="14"/>
    <!-- another program (a design app) with a narrow panel added on the right -->
    <rect class="paper" x="910" y="270" width="180" height="104" rx="6"/>
    <line class="thin" x1="910" y1="288" x2="1090" y2="288"/>
    <circle cx="921" cy="279" r="3" class="ink-fill"/><circle cx="932" cy="279" r="3" class="ink-fill"/><circle cx="943" cy="279" r="3" class="ink-fill"/>
    <!-- a box of a building inside the design app -->
    <path class="ink" d="M930 360 V322 L962 306 L994 322 V360 Z"/><line class="thin" x1="962" y1="306" x2="962" y2="344"/><line class="thin" x1="930" y1="322" x2="962" y2="338"/><line class="thin" x1="994" y1="322" x2="962" y2="338"/>
    <rect class="soft" x="1020" y="288" width="70" height="86"/>
    <rect class="ink-fill" x="1046" y="298" width="36" height="10" rx="5"/>
    <rect class="hair" x="1028" y="352" width="54" height="12" rx="6"/>
    <text class="label" x="1000" y="398" text-anchor="middle">An add-in</text>
    <text class="body" x="1000" y="424" text-anchor="middle">a panel inside another app</text>
  </g>
</svg>
