<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="One model, many apps. The model reads text and writes text. The Chat tab wraps it with the app's own instructions, its own space to run code and web search, but it cannot reach your folder. The Code tab wraps the same model with the app's own instructions, your folder and files, your tools, skills and CLAUDE.md, and it asks you before acting. Any other app, such as a website, a phone app or a plugin in a design app, wraps the same model with different instructions and tools">

  <!-- 1 · the model on its own -->
  <g data-step="1">
    <rect class="accent-fill" x="440" y="20" width="320" height="86"/>
    <text class="on-accent big" x="600" y="58" text-anchor="middle">THE MODEL</text>
    <text class="on-accent" x="600" y="88" text-anchor="middle" style="font-size:16px">reads text, writes text</text>
  </g>

  <!-- 2 · the Chat tab: an app around it -->
  <g data-step="2">
    <line class="ink dash" x1="560" y1="106" x2="210" y2="170"/>
    <rect class="paper" x="30" y="170" width="360" height="280" rx="14"/>
    <text class="label" x="54" y="202">The Chat tab</text>
    <rect class="box-accent" x="54" y="220" width="170" height="42"/>
    <text x="139" y="247" text-anchor="middle">the model</text>
    <text class="small" x="54" y="300">+ the app's own instructions</text>
    <text class="small" x="54" y="330">+ its own space to run code</text>
    <text class="small" x="54" y="360">+ web search, if it's on</text>
    <text class="small" x="54" y="390">- can't reach your folder</text>
  </g>

  <!-- 3 · the Code tab: the same model, more equipment -->
  <g data-step="3">
    <line class="ink dash" x1="600" y1="106" x2="600" y2="170"/>
    <rect class="paper" x="420" y="170" width="360" height="280" rx="14" style="stroke:var(--accent);stroke-width:3"/>
    <text class="label accent-text" x="444" y="202">The Code tab</text>
    <rect class="box-accent" x="444" y="220" width="170" height="42"/>
    <text x="529" y="247" text-anchor="middle">the model</text>
    <text class="small" x="444" y="300">+ the app's own instructions</text>
    <text class="small" x="444" y="330">+ your folder and your files</text>
    <text class="small" x="444" y="360">+ your tools, skills, CLAUDE.md</text>
    <text class="small" x="444" y="390">+ asks you before acting</text>
  </g>

  <!-- 4 · any other app -->
  <g data-step="4">
    <line class="ink dash" x1="640" y1="106" x2="990" y2="170"/>
    <rect class="paper" x="810" y="170" width="360" height="280" rx="14"/>
    <text class="label" x="834" y="202">Any other app</text>
    <rect class="box-accent" x="834" y="220" width="170" height="42"/>
    <text x="919" y="247" text-anchor="middle">the model</text>
    <text class="small" x="834" y="300">a website, a phone app,</text>
    <text class="small" x="834" y="330">a plugin in a design app:</text>
    <text class="small" x="834" y="360">the same model, with</text>
    <text class="small" x="834" y="390">other instructions and tools</text>
  </g>
</svg>
