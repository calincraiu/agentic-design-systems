<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-label="An LLM writes one piece at a time. Round 1: it reads 'A house has walls, a floor, and a' and adds the piece 'roof'. Round 2: that piece goes back in, it reads the longer text and adds a comma. Round 3: it reads it all again and adds 'and'. It has no plan, and no looking ahead: each piece comes only from what is already there">
  <defs>
    <marker id="tl-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="ah-accent"/></marker>
  </defs>
  <g data-step="1">
    <text class="label" x="40" y="80">Round 1</text>
    <text x="170" y="80" style="font-size:22px">A house has walls, a floor, and a</text>
    <rect class="accent-fill" x="614.6" y="50" width="76.8" height="44"/>
    <text class="on-accent" x="653.0" y="80" text-anchor="middle" style="font-size:22px">roof</text>
  </g>
  <g data-step="2">
    <line class="accent dash" x1="653.0" y1="98" x2="645.2" y2="160" marker-end="url(#tl-acc)"/>
    <text class="small" x="669.0" y="129">goes back in</text>
    <text class="label" x="40" y="190">Round 2</text>
    <text x="170" y="190" style="font-size:22px">A house has walls, a floor, and a roof</text>
    <rect class="accent-fill" x="680.6" y="160" width="37.2" height="44"/>
    <text class="on-accent" x="699.2" y="190" text-anchor="middle" style="font-size:22px">,</text>
  </g>
  <g data-step="3">
    <line class="accent dash" x1="699.2" y1="208" x2="678.2" y2="270" marker-end="url(#tl-acc)"/>
    <text class="small" x="715.2" y="239">goes back in</text>
    <text class="label" x="40" y="300">Round 3</text>
    <text x="170" y="300" style="font-size:22px">A house has walls, a floor, and a roof,</text>
    <rect class="accent-fill" x="693.8" y="270" width="63.6" height="44"/>
    <text class="on-accent" x="725.6" y="300" text-anchor="middle" style="font-size:22px">and</text>
    <text class="muted-text" x="769.4" y="300" style="font-size:22px">…</text>
  </g>
  <g data-step="4">
    <text class="body" x="40" y="392">No plan, no looking ahead: each piece comes only from what is already there.</text>
  </g>
  <rect class="hair" x="40" y="420" width="22" height="16"/><text class="label" x="72" y="433">already there</text>
  <rect class="accent-fill" x="240" y="420" width="22" height="16"/><text class="label" x="272" y="433">the new piece</text>
</svg>
