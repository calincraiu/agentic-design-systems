<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" role="img" aria-label="Anthropic is a company, drawn as a building, which makes a product named Claude. Claude is two things. The model is the AI itself, drawn as a network of connected nodes like a brain, which reads text and writes text. The app is the window you type into, such as Claude Desktop or Claude Code">

  <!-- 1 · the company -->
  <g data-step="1">
    <rect class="paper" x="40" y="40" width="150" height="150" rx="14"/>
    <!-- a small office block: facade, window grid, door -->
    <rect class="paper" x="80" y="68" width="70" height="104"/>
    <g class="thin">
      <line x1="80" y1="92" x2="150" y2="92"/><line x1="80" y1="116" x2="150" y2="116"/><line x1="80" y1="140" x2="150" y2="140"/>
      <line x1="103" y1="68" x2="103" y2="140"/><line x1="127" y1="68" x2="127" y2="140"/>
    </g>
    <rect class="ink-fill" x="105" y="146" width="20" height="26"/>
    <text class="label" x="230" y="96">Anthropic</text>
    <text class="body" x="230" y="132">a company</text>
    <text class="small" x="230" y="160">it makes Claude</text>
  </g>

  <!-- 2 · the model -->
  <g data-step="2">
    <rect class="box-accent" x="40" y="224" width="150" height="150" rx="14"/>
    <!-- a small neural network, input to output: the brain that reads and writes text -->
    <g class="thin">
      <line x1="66" y1="262" x2="115" y2="250"/><line x1="66" y1="262" x2="115" y2="281"/><line x1="66" y1="262" x2="115" y2="312"/><line x1="66" y1="262" x2="115" y2="343"/>
      <line x1="66" y1="300" x2="115" y2="250"/><line x1="66" y1="300" x2="115" y2="281"/><line x1="66" y1="300" x2="115" y2="312"/><line x1="66" y1="300" x2="115" y2="343"/>
      <line x1="66" y1="338" x2="115" y2="250"/><line x1="66" y1="338" x2="115" y2="281"/><line x1="66" y1="338" x2="115" y2="312"/><line x1="66" y1="338" x2="115" y2="343"/>
      <line x1="115" y1="250" x2="164" y2="262"/><line x1="115" y1="250" x2="164" y2="300"/><line x1="115" y1="250" x2="164" y2="338"/>
      <line x1="115" y1="281" x2="164" y2="262"/><line x1="115" y1="281" x2="164" y2="300"/><line x1="115" y1="281" x2="164" y2="338"/>
      <line x1="115" y1="312" x2="164" y2="262"/><line x1="115" y1="312" x2="164" y2="300"/><line x1="115" y1="312" x2="164" y2="338"/>
      <line x1="115" y1="343" x2="164" y2="262"/><line x1="115" y1="343" x2="164" y2="300"/><line x1="115" y1="343" x2="164" y2="338"/>
    </g>
    <g class="accent-fill">
      <circle cx="66" cy="262" r="6"/><circle cx="66" cy="300" r="6"/><circle cx="66" cy="338" r="6"/>
      <circle cx="115" cy="250" r="6"/><circle cx="115" cy="281" r="6"/><circle cx="115" cy="312" r="6"/><circle cx="115" cy="343" r="6"/>
      <circle cx="164" cy="262" r="6"/><circle cx="164" cy="300" r="6"/><circle cx="164" cy="338" r="6"/>
    </g>
    <text class="label accent-text" x="230" y="280">The model</text>
    <text class="body" x="230" y="316">the AI itself: a brain</text>
    <text class="small" x="230" y="344">reads and writes text</text>
  </g>

  <!-- 3 · the app -->
  <g data-step="3">
    <rect class="box-blue" x="40" y="408" width="150" height="150" rx="14"/>
    <!-- a window: title bar with three dots, a message, a reply, and an input line -->
    <rect class="paper" x="62" y="432" width="106" height="102" rx="6"/>
    <line class="thin" x1="62" y1="450" x2="168" y2="450"/>
    <circle cx="73" cy="441" r="2.5" class="ink-fill"/><circle cx="83" cy="441" r="2.5" class="ink-fill"/><circle cx="93" cy="441" r="2.5" class="ink-fill"/>
    <rect class="ink-fill" x="112" y="458" width="46" height="12" rx="6"/>
    <rect class="soft" x="72" y="476" width="62" height="12" rx="6"/>
    <rect class="hair" x="70" y="506" width="90" height="16" rx="8"/>
    <text class="label" x="230" y="464" style="fill:var(--blue)">The app</text>
    <text class="body" x="230" y="500">the window you type in</text>
    <text class="small" x="230" y="528">e.g. Claude Desktop</text>
  </g>

  <!-- the model and the app together are the product named "Claude" -->
  <g data-step="4">
    <path class="accent" d="M470 254 H500 V528 H470" style="stroke-width:3"/>
    <line class="accent" x1="500" y1="391" x2="530" y2="391"/>
    <text class="big accent-text" x="540" y="388">"Claude"</text>
    <text class="small" x="540" y="416">the product</text>
  </g>
</svg>
