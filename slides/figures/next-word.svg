<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-label="Likely next words, illustrative and not measured. After 'A house has walls, a floor, and a', roof is by far the likeliest, then ceiling, door and garden. After 'Form follows', function takes almost everything">
  <!-- Illustrative weights only: the shape matters, not the numbers. Bars: 400 px = 100%. -->
  <g data-step="1">
    <text x="0" y="28">"A house has walls, a floor, and a …"</text>
    <g text-anchor="end">
      <text x="138" y="66">roof</text>
      <text x="138" y="100">ceiling</text>
      <text x="138" y="134">door</text>
      <text x="138" y="168">garden</text>
    </g>
    <rect class="accent-fill" x="150" y="47" width="284" height="26"/>
    <rect class="soft" x="150" y="81" width="48" height="26"/>
    <rect class="soft" x="150" y="115" width="24" height="26"/>
    <rect class="soft" x="150" y="149" width="16" height="26"/>
    <text class="small" x="444" y="66">71%</text>
    <text class="small" x="208" y="100">12%</text>
    <text class="small" x="184" y="134">6%</text>
    <text class="small" x="176" y="168">4%</text>
    <text class="label" x="0" y="372">Illustrative, not measured</text>
  </g>

  <g data-step="2">
    <text x="0" y="226">"Form follows …"</text>
    <g text-anchor="end">
      <text x="138" y="264">function</text>
      <text x="138" y="298">form</text>
      <text x="138" y="332">fashion</text>
    </g>
    <rect class="accent-fill" x="150" y="245" width="384" height="26"/>
    <rect class="soft" x="150" y="279" width="8" height="26"/>
    <rect class="soft" x="150" y="313" width="4" height="26"/>
    <text class="small" x="544" y="264">96%</text>
    <text class="small" x="168" y="298">2%</text>
    <text class="small" x="164" y="332">1%</text>
  </g>
</svg>
