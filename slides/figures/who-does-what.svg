<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="Who does what: the agent, the tool and you">
  <g data-step="1">
    <rect class="accent-fill" x="40" y="30" width="340" height="64"/>
    <text class="big on-accent" x="62" y="72">AGENT</text>
    <text class="body" x="40" y="146" style="font-weight:600">Reads a plain-language brief</text>
    <text class="body" x="40" y="186" style="font-weight:600">Proposes and compares options</text>
    <line class="thin" x1="40" y1="222" x2="380" y2="222"/>
    <text class="body muted-text" x="40" y="256">Good with ambiguity and language.</text>
    <text class="body muted-text" x="40" y="286">Fast at exploring, and it explains.</text>
  </g>

  <g data-step="2">
    <rect class="blue-fill" x="430" y="30" width="340" height="64"/>
    <text class="big on-accent" x="452" y="72">TOOL</text>
    <text class="body" x="430" y="146" style="font-weight:600">Makes exact geometry</text>
    <text class="body" x="430" y="186" style="font-weight:600">Measures and checks limits</text>
    <line class="thin" x1="430" y1="222" x2="770" y2="222"/>
    <text class="body muted-text" x="430" y="256">The same input gives the same</text>
    <text class="body muted-text" x="430" y="286">output. Numbers are right,</text>
    <text class="body muted-text" x="430" y="316">not just plausible.</text>
  </g>

  <g data-step="3">
    <rect class="ink-fill" x="820" y="30" width="340" height="64"/>
    <text class="big paper-text" x="842" y="72">YOU</text>
    <text class="body" x="820" y="146" style="font-weight:600">Decide what is good</text>
    <text class="body" x="820" y="186" style="font-weight:600">That is design.</text>
    <line class="thin" x1="820" y1="222" x2="1160" y2="222"/>
    <text class="body muted-text" x="820" y="256">An image or a confident</text>
    <text class="body muted-text" x="820" y="286">paragraph is not evidence.</text>
    <text class="body muted-text" x="820" y="316">The metrics are, as far as</text>
    <text class="body muted-text" x="820" y="346">they go.</text>
  </g>
</svg>
